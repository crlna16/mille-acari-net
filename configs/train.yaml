# Default training configuration
name: default-train

seed: 456123786

datamodule:
  images_dir: ./data/images
  labels_dir: ./data/labels
  batch_size: 20
  num_workers: 0
  val_size: 3
  max_samples: 100

backbone:
  # __target__: src.milleacarinet.model.Yolov5Backbone
  flavor: yolov5s
  pretrained: True
  freeze_depth: 0 

model:
  lr: 2.0e-4 # learning rate
  min_obj_score: 0.01
  iou_threshold: 0.9
  confidence_threshold: 0.5

trainer:
  accelerator: mps 
  num_nodes: 1
  max_epochs: 100